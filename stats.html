<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">

<script>
  // Register the Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - FitTrack</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Log</a>
        <a href="stats.html" class="active">Stats</a>
        <a href="settings.html">Settings</a>
    </nav>

    <main>
        <h1>Performance Analytics</h1>
        
        <section class="card">
            <h3>All-Time Averages</h3>
            <div id="analytics-summary">
                <p>Log data to see your progress analytics.</p>
            </div>
        </section>

        <section class="charts-container">
            <h3>Average Performance vs. Goals</h3>
            <div class="charts-grid">
                <div class="chart-box">
                    <canvas id="calChart"></canvas>
                </div>
                <div class="chart-box">
                    <canvas id="protChart"></canvas>
                </div>
                <div class="chart-box">
                    <canvas id="sleepChart"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
